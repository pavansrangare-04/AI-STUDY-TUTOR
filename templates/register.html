<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Virtual AI Tutor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 class="auth-title">Create Student Profile</h1>
                <p class="auth-subtitle">Get personalized curriculum explanations tailored to your level</p>
            </div>

            <!-- Flash Alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <span>{{ message }}</span>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Choose a username" required minlength="3" />
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="student@college.edu" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Create a password (min 6 characters)" required minlength="6" />
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Academic Level</label>
                        <select name="learning_level" class="form-select">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate" selected>Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Explanation Style</label>
                        <select name="explanation_style" class="form-select">
                            <option value="concise">Concise</option>
                            <option value="detailed" selected>Detailed</option>
                            <option value="step_by_step">Step-by-Step</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    Register & Start Learning
                </button>
            </form>

            <div class="auth-footer">
                <span>Already have an account?</span>
                <a href="{{ url_for('auth.login') }}" class="auth-link">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
