{% extends "base.html" %}

{% block title %}Server Error - Virtual AI Tutor{% endblock %}

{% block content %}
<div class="error-page-container">
    <div class="card error-card">
        <div class="error-code text-danger">500</div>
        <h1 class="error-title">System Exception</h1>
        <p class="error-desc">An unexpected issue occurred while processing your request. Please try again or notify the administrator.</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
